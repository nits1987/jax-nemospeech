[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fcrnnt-jax"
version = "0.1.0"
description = "Qualification PoC for FastConformer RNN-T training with JAX on Cloud TPU"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "fcrnnt-jax contributors" }]
dependencies = [
  "jax>=0.4.35",
  "flax>=0.10.2",
  "optax>=0.2.4",
  "orbax-checkpoint==0.11.30",
  "numpy>=1.26",
  "safetensors>=0.4.5",
]

[project.optional-dependencies]
audio = ["soundfile>=0.12.1"]
dev = ["pytest>=8.3", "pytest-cov>=5.0"]

[project.scripts]
fcrnnt-jax = "fcrnnt_jax.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
